<div class="vip-section-title">
  <span class="vip-ico-wrap" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="vipGradSync" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="var(--vip-ico-sync-a)"/><stop offset="100%" stop-color="var(--vip-ico-sync-b)"/></linearGradient></defs><path stroke="url(#vipGradSync)" d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path stroke="url(#vipGradSync)" d="M21 3v5h-5"/><path stroke="url(#vipGradSync)" d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path stroke="url(#vipGradSync)" d="M8 16H3v5"/></svg></span>

<div class="cb-card">
  <div class="card-bd member-status-text">
    {% if vipStatus == 'guest' %}
      <div class="status-main">登录后查看会员状态</div>
      <div class="status-sub">开通会员后可缩短自测与提交冷却</div>
    {% elif vipStatus == 'vip' %}
      <div class="status-main">您已经是会员</div>
      <div class="status-sub">感谢支持 FishOJ，后续权益会陆续上线</div>
    {% else %}
      <div class="status-main">您还不是会员</div>
      <div class="status-sub">开通会员，享受专属特权</div>
    {% endif %}
  </div>
</div>
